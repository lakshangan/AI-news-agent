name: AI News Agent

on:
  workflow_dispatch:

jobs:
  run-news-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug Files
        run: |
          pwd
          ls -la

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Agent
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python agent.py